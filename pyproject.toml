[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-lens-emulator"
version = "0.1.0"
description = "SIREN-based emulators for gravitational-lensing amplification factors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "mpmath>=1.3",
  "torch>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gw_lens_emulator*"]
